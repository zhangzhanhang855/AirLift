name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inspect Makefile Targets
        run: |
          cat Makefile

      - name: Build via Make
        run: |
          make

      - name: Locate Build Outputs & Package IPA
        run: |
          # 檢查 Makefile 生成了什麼（通常在 build/ 或當前目錄）
          ls -la
          
          mkdir -p Payload
          # 尋找編譯出來的 .app 或二進制文件
          APP_DIR=$(find . -maxdepth 3 -name "*.app" -type d | head -n 1)
          
          if [ -n "$APP_DIR" ]; then
            echo "Found app bundle: $APP_DIR"
            cp -r "$APP_DIR" Payload/
            zip -r AirLift-unsigned.ipa Payload
          else
            echo "No .app bundle found directly, checking build directory..."
            ls -R
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirLift-ipa
          path: AirLift-unsigned.ipa
